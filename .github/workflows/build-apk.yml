name: Build Eta-por Test APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      # 👉 手动cd进入子目录，避免working-directory叠加bug
      - name: Flutter pub get
        run: |
          cd Eta-por
          flutter pub get

      - name: Build Release APK（无签名）
        run: |
          cd Eta-por
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eta-por-test-apk
          path: Eta-por/build/app/outputs/flutter-apk/*.apk
